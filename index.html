<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timbre Curve Lab</title>
    <link rel="icon" type="image/svg+xml" href="assets/identity/timbre-micro.svg?v=hub-v0.10">
    <link rel="stylesheet" href="assets/identity/tokens.css?v=hub-v0.10">
    <link rel="stylesheet" href="src/styles.css?v=20261005-output-time-02">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brandMark" src="assets/identity/timbre-symbol.svg?v=hub-v0.10" width="48" height="48" alt="" aria-hidden="true">
          <div class="brandCopy">
            <h1><span>Timbre </span><span class="brandAccent">Curve Lab</span></h1>
            <p class="tagline">Draw filter color onto sound.</p>
            <p class="statusLine"><span id="fileStatus">No audio loaded</span><span class="privacyNote">Local browser processing. No upload.</span></p>
            <p class="formatNote">Recommended: WAV, MP3. Some formats may vary by browser.</p>
          </div>
        </div>
        <div class="transport">
          <label class="fileButton">
            Open Audio
            <input id="fileInput" type="file" accept="audio/*">
          </label>
          <button id="downloadButton" type="button" title="Stereo WAV · 48 kHz · 24-bit PCM" disabled>Download WAV</button>
        </div>
      </header>

      <section class="editor">
        <div class="effectBar">
          <div class="effectChain" aria-label="Effect chain">
            <button id="lowpassMode" class="effectModule lowpassModule" type="button">Low Pass</button>
            <button id="highpassMode" class="effectModule highpassModule" type="button">High Pass</button>
            <button id="bandpassMode" class="effectModule bandpassModule" type="button">Band Pass</button>
            <button id="combMode" class="effectModule combModule" type="button">Comb</button>
            <button id="flangerMode" class="effectModule flangerModule" type="button">Flanger</button>
            <button id="chorusMode" class="effectModule chorusModule" type="button">Chorus</button>
            <button id="delayMode" class="effectModule delayModule" type="button">Delay</button>
            <div class="toolToggle" role="group" aria-label="Curve editing tool">
              <button id="penTool" class="active" type="button" aria-label="Pen" aria-pressed="true" title="Pen: add or move points">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg>
              </button>
              <button id="eraserTool" type="button" aria-label="Eraser" aria-pressed="false" title="Eraser: click a point to delete. Mac: Command-click; PC: Ctrl-click">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4-4a2 2 0 0 1 0-3L13 4a2 2 0 0 1 3 0l6 6a2 2 0 0 1 0 3l-8 8"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
              </button>
            </div>
          </div>
          <div class="curveActions">
            <button id="clearCurveButton" type="button">Clear Current</button>
            <button id="resetButton" type="button">Reset All</button>
          </div>
        </div>
        <div id="parameterBar" class="parameterBar" aria-label="Effect parameters" hidden>
          <button id="bandpassCenterParam" class="parameterButton wideParameter" type="button">Center Frequency</button>
          <button id="bandpassWidthParam" class="parameterButton" type="button">Width</button>
          <button id="combDelayParam" class="parameterButton wideParameter" type="button">Delay Time</button>
          <button id="combFeedbackParam" class="parameterButton" type="button">Feedback</button>
          <button id="combMixParam" class="parameterButton" type="button">Mix</button>
          <button id="flangerDelayParam" class="parameterButton wideParameter" type="button">Delay Time</button>
          <button id="flangerDepthParam" class="parameterButton" type="button">Depth</button>
          <button id="flangerRateParam" class="parameterButton" type="button">Rate</button>
          <button id="flangerFeedbackParam" class="parameterButton" type="button">Feedback</button>
          <button id="chorusDelayParam" class="parameterButton wideParameter" type="button">Delay Time</button>
          <button id="chorusDepthParam" class="parameterButton" type="button">Depth</button>
          <button id="chorusRateParam" class="parameterButton" type="button">Rate</button>
          <button id="chorusMixParam" class="parameterButton" type="button">Mix</button>
          <button id="delayTimeParam" class="parameterButton wideParameter" type="button">Delay Time</button>
          <button id="delayFeedbackParam" class="parameterButton" type="button">Feedback</button>
          <button id="delayMixParam" class="parameterButton" type="button">Mix</button>
        </div>
        <div id="parameterLegend" class="parameterLegend" aria-label="Current parameter ranges"></div>
        <div class="panel">
          <div class="readout">
            <span>Curve</span>
            <strong id="modeReadout">Low Pass</strong>
          </div>
          <div class="readout">
            <span>Points</span>
            <strong id="pointsReadout">2</strong>
          </div>
          <div class="readout">
            <span>Engine</span>
            <strong>Timbre Filter</strong>
          </div>
          <div class="readout">
            <span>Value</span>
            <strong id="cutoffReadout">1.0 kHz</strong>
          </div>
          <div class="readout">
            <span>WAV</span>
            <strong id="downloadReadout">not ready</strong>
          </div>
        </div>
        <div class="canvasFrame">
          <canvas id="waveCanvas" width="1400" height="620"></canvas>
        </div>
        <div class="outputWaveFrame">
          <canvas id="outputWaveCanvas" width="1400" height="96" role="slider" tabindex="0"
            aria-label="Output time position on the original source waveform. Click or drag to seek; effect tails are not shown"
            aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-disabled="true"
            title="Source waveform, not processed audio. Delay tails are not shown. Click or drag to seek."></canvas>
        </div>
        <div class="chainLabel">Signal Chain</div>
        <div id="chainDiagram" class="chainDiagram" aria-label="Current effect order"></div>
      </section>

      <footer class="playbackBar" aria-label="Playback and output monitoring">
        <div class="bottomTransport" aria-label="Transport controls">
          <button id="playButton" type="button" disabled>Play</button>
          <button id="stopButton" type="button" disabled>Stop</button>
        </div>
        <output id="timeStatus" aria-live="off">00:00.00 / 00:00.00</output>
        <section class="outputMeter" aria-label="Stereo output level">
          <div class="meterTitle">OUT</div>
          <div class="meterChannels">
            <div class="meterRow" data-meter-channel="0">
              <span class="meterChannelLabel">L</span>
              <div class="meterTrack" aria-hidden="true">
                <div class="meterRms"></div>
                <div class="meterPeak"></div>
                <div class="meterHold"></div>
              </div>
              <span class="meterValue">-∞</span>
            </div>
            <div class="meterRow" data-meter-channel="1">
              <span class="meterChannelLabel">R</span>
              <div class="meterTrack" aria-hidden="true">
                <div class="meterRms"></div>
                <div class="meterPeak"></div>
                <div class="meterHold"></div>
              </div>
              <span class="meterValue">-∞</span>
            </div>
          </div>
          <button id="meterClipButton" class="meterClip" type="button" aria-pressed="false" title="Clear the held clip indicator">CLIP</button>
        </section>
      </footer>
    </main>

    <script src="src/app.js?v=20261008-initial-stop1" type="module"></script>
  </body>
</html>
